<!doctype html>
<html><head><meta charset="utf-8"><title>UP3 SGP PRO promo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#050914}
body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#050914}
canvas{position:absolute;inset:0}
.abs{position:absolute}
.layer{position:absolute;inset:0;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.0}
/* phone */
.world{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 45%}
.phone{position:absolute;left:50%;top:50%;width:590px;height:1242px;margin:-621px 0 0 -295px;border-radius:84px;
  background:linear-gradient(145deg,#3a4660,#0b1020 40%,#1c2438);padding:15px;
  box-shadow:0 0 0 2px rgba(148,163,255,.35),0 60px 140px rgba(0,0,0,.7),0 0 120px rgba(59,130,246,.35);transform-style:preserve-3d;will-change:transform}
.scr{position:relative;width:560px;height:1212px;border-radius:70px;overflow:hidden;background:#0f172a}
.scr img{position:absolute;left:0;top:0;width:560px;display:block}
.island{position:absolute;left:50%;top:14px;width:150px;height:40px;margin-left:-75px;background:#000;border-radius:22px;z-index:5}
.sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 48%,rgba(255,255,255,.05) 55%,transparent 62%);background-size:300% 100%;mix-blend-mode:screen;z-index:6}
/* type */
.t{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.035em;line-height:.95}
.ch{display:inline-block;will-change:transform,opacity,filter}
.grad{background:linear-gradient(90deg,#60a5fa,#a78bfa 55%,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{position:absolute;left:50%;transform:translateX(-50%);padding:14px 30px;border-radius:999px;font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(59,130,246,.14);border:2px solid rgba(96,165,250,.55);color:#bfdbfe;backdrop-filter:blur(8px);white-space:nowrap}
.chip{position:absolute;padding:20px 30px;border-radius:26px;background:rgba(15,23,42,.78);border:2px solid rgba(148,163,255,.4);
  box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(99,102,241,.35);font-weight:800;font-size:40px;white-space:nowrap;backdrop-filter:blur(10px)}
.chip small{display:block;font-size:22px;font-weight:600;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.num{font-family:'Inter Display';font-weight:900}
.idx{font-family:'JetBrains Mono';font-weight:700;font-size:34px;color:#60a5fa;letter-spacing:.1em}
.flash{position:absolute;inset:0;background:#fff;opacity:0;mix-blend-mode:screen}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.65) 100%)}
.logo{position:absolute;left:50%;top:600px;width:300px;height:300px;margin-left:-150px;border-radius:84px;
  background:linear-gradient(135deg,#3b82f6,#6366f1 60%,#8b5cf6);display:flex;align-items:center;justify-content:center;
  box-shadow:0 30px 90px rgba(59,130,246,.55),inset 0 2px 0 rgba(255,255,255,.35)}
.ring{position:absolute;left:50%;top:750px;border-radius:50%;border:4px solid rgba(147,197,253,.9)}
.cta{position:absolute;left:50%;top:1450px;transform:translateX(-50%);padding:38px 78px;border-radius:999px;font-size:52px;font-weight:800;white-space:nowrap;
  background:linear-gradient(90deg,#2563eb,#6366f1,#8b5cf6);box-shadow:0 20px 70px rgba(99,102,241,.6),inset 0 2px 0 rgba(255,255,255,.3);overflow:hidden}
.cta .sh{position:absolute;top:0;bottom:0;width:180px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg)}
.alertbar{position:absolute;left:50%;transform:translateX(-50%);padding:18px 34px;border-radius:18px;font-weight:800;font-size:34px;white-space:nowrap;letter-spacing:.02em}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px);mix-blend-mode:overlay}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1080" height="1920"></canvas>
<div class="glow" id="g1" style="width:900px;height:900px;background:#2563eb"></div>
<div class="glow" id="g2" style="width:800px;height:800px;background:#7c3aed"></div>

<!-- S1 hook -->

  <div class="phone" id="f0"><div class="scr"><img src="shots/home_light.png"><div class="island"></div></div></div>

</div>

  <div class="t" id="s3a" style="top:180px;font-size:104px"></div>
  <div class="alertbar" id="s3ok" style="top:1700px;background:rgba(22,163,74,.2);border:2px solid #22c55e;color:#86efac">✓ Registrado en el historial</div>
</div>

<div class="layer" id="s4">
  <div class="t" id="s4a" style="top:170px;font-size:120px"></div>
  <div class="t" id="s4b" style="top:300px;font-size:120px"></div>
  <div class="t" id="s4c" style="top:430px;font-size:120px"></div>
</div>

<!-- S5 end -->
<div class="layer" id="s5">
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div class="logo" id="logo"><svg width="190" height="190" viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 8v46M18 54h28M12 18h40M32 12a3 3 0 1 0 0 .1"/><path d="M14 18 6 36h16zM50 18l-8 18h16z"/><path d="M6 36a8 5 0 0 0 16 0M42 36a8 5 0 0 0 16 0"/></svg></div>
  <div class="t" id="s5name" style="top:980px;font-size:150px"></div>
  <div class="t" id="s5sub" style="top:1150px;font-size:46px;font-weight:600;color:#cbd5e1;letter-spacing:.01em">Sistema de Gestión Penitenciaria</div>
  <div class="t" id="s5up" style="top:1225px;font-size:32px;font-weight:600;color:#64748b;letter-spacing:.22em">UP Nº3 CONCORDIA · SPER</div>
  <div class="cta" id="cta"><div class="sh" id="ctash"></div>Ingresá ahora →</div>
</div>

<div class="scan"></div>
<div class="vign"></div>
<div class="flash" id="flash"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eExpo=x=>x>=1?1:1-Math.pow(2,-10*x), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// kinetic text: split into chars
function setText(el,txt,cls){ if(el._t===txt)return; el._t=txt; el.innerHTML=txt.split('').map(c=>c===' '?'<span class="ch">&nbsp;</span>':'<span class="ch'+(cls?' '+cls:'')+'">'+c+'</span>').join(''); el._ch=[...el.querySelectorAll('.ch')]}
function kin(el,txt,t,t0,dur=.5,stag=.025,cls,out){ // in at t0, optional out [t1]
  setText(el,txt,cls);
  el._ch.forEach((c,i)=>{let p=eExpo(seg(t,t0+i*stag,t0+i*stag+dur));let o=p,y=(1-p)*90,b=(1-p)*16,s=lerp(1.6,1,p);
    if(out!=null){const q=eIO(seg(t,out+i*stag*.5,out+i*stag*.5+.25));o*=1-q;y-=q*60;b+=q*14;s*=1+q*.3}
    c.style.opacity=o;c.style.transform=`translateY(${y}px) scale(${s})`;c.style.filter=b>.3?`blur(${b}px)`:'none'});
}
function show(el,v){el.style.display=v?'block':'none'}

// background canvas: perspective grid + particles
const bg=$('bg').getContext('2d');
const N=170, parts=[...Array(N)].map((_,i)=>({x:rnd(i)*1080,y:rnd(i+500)*1920,z:.3+rnd(i+900)*1.2,ph:rnd(i+77)*6.28,hue:rnd(i+33)}));
function drawBG(t,cfg){
  bg.globalCompositeOperation='source-over';
  const g=bg.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#050914');g.addColorStop(.55,'#0b1533');g.addColorStop(1,'#060a18');
  bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  // grid floor
  if(cfg.grid>0){bg.save();bg.globalAlpha=cfg.grid;bg.strokeStyle='rgba(96,165,250,.55)';bg.lineWidth=2;
    const hz=1180,sp=(t*cfg.speed)%1;
    for(let i=0;i<16;i++){const z=(i+1-sp);const y=hz+ (740)/z*.9; if(y>1920||z<=0)continue;bg.globalAlpha=cfg.grid*cl(1-z/16)*.9;bg.beginPath();bg.moveTo(0,y);bg.lineTo(1080,y);bg.stroke()}
    bg.globalAlpha=cfg.grid*.6;for(let k=-14;k<=14;k++){bg.beginPath();bg.moveTo(540+k*8,hz);bg.lineTo(540+k*190,1920);bg.stroke()}
    const hg=bg.createLinearGradient(0,hz-140,0,hz+60);hg.addColorStop(0,'rgba(5,9,20,0)');hg.addColorStop(.7,'rgba(99,102,241,.35)');hg.addColorStop(1,'rgba(5,9,20,0)');
    bg.globalAlpha=cfg.grid;bg.fillStyle=hg;bg.fillRect(0,hz-140,1080,200);bg.restore()}
  // light rays
  if(cfg.rays>0){bg.save();bg.translate(540,cfg.rayY||900);bg.globalCompositeOperation='lighter';
    for(let i=0;i<14;i++){const a=i/14*Math.PI*2+t*.25;bg.rotate(Math.PI*2/14);const rg=bg.createLinearGradient(0,0,1300,0);rg.addColorStop(0,`rgba(129,140,248,${.22*cfg.rays})`);rg.addColorStop(1,'rgba(129,140,248,0)');
      bg.fillStyle=rg;bg.beginPath();bg.moveTo(0,0);bg.lineTo(1300,-60-30*Math.sin(a*3));bg.lineTo(1300,60);bg.closePath();bg.fill()}
    bg.restore()}
  // particles
  bg.globalCompositeOperation='lighter';
  for(const p of parts){let x=p.x+Math.sin(t*.6+p.ph)*30*p.z,y=((p.y-t*cfg.drift*p.z*60)%1920+1920)%1920;
    let r=2.2*p.z,a=(.35+.45*Math.sin(t*3+p.ph*3))*cfg.part;
    // burst
    for(const bt of cfg.bursts){const dt=t-bt[0];if(dt>0&&dt<1.6){const ang=p.ph,sp=eOut(cl(dt/1.6))*(500+900*p.hue);x=bt[1]+Math.cos(ang)*sp;y=bt[2]+Math.sin(ang)*sp;a=Math.max(a,(1-dt/1.6)*1);r*=1.6}}
    if(a<=0)continue;const col=p.hue<.5?'147,197,253':(p.hue<.8?'196,181,253':'255,255,255');
    const gr=bg.createRadialGradient(x,y,0,x,y,r*5);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);bg.fillStyle=gr;bg.fillRect(x-r*5,y-r*5,r*10,r*10)}
  bg.globalCompositeOperation='source-over';
}
function glow(id,x,y,o,s=1){const e=$(id);e.style.opacity=o;e.style.transform=`translate(${x-e.offsetWidth/2}px,${y-e.offsetHeight/2}px) scale(${s})`}
function phoneT(el,o){el.style.transform=`translate3d(${o.x||0}px,${o.y||0}px,${o.z||0}px) rotateX(${o.rx||0}deg) rotateY(${o.ry||0}deg) rotateZ(${o.rz||0}deg) scale(${o.s==null?1:o.s})`;
  el.style.opacity=o.o==null?1:o.o; el.style.filter=o.b>.3?`blur(${o.b}px) brightness(${o.br||1})`:(o.br?`brightness(${o.br})`:'none'); el.style.display=(o.o===0)?'none':'block'}
function scr(img,src,o){if(img._s!==src){img.src=src;img._s=src} img.style.opacity=o.o==null?1:o.o; img.style.transform=`translateY(${-(o.ty||0)}px)`;img.style.transformOrigin=`${o.ox||50}% ${o.oy||0}%`; if(o.s)img.style.transform+=` scale(${o.s})`}

const SHOT=n=>'shots/'+n+'.png';
const FEAT=[ // 7-13
 {t0:7.0,idx:'01',txt:'Alertas que avisan',hl:'',img:'home_dark',zoom:{s:1.55,ox:50,oy:30},ry:-14},
 {t0:8.5,idx:'02',txt:'Búsqueda al instante',img:'pen_dark',img2:'pen_search',ry:14},
 {t0:10.0,idx:'03',txt:'Ficha completa',img:'home_dark',img2:'ficha_cumplido',ry:-14},
 {t0:11.5,idx:'04',txt:'Egresos en un toque',img:'modal_lib',img2:'toast_lib',ry:14},
];

function render(t){
  const fl=$('flash');let flash=0;
  // ---------- background config
  let cfg={grid:0,speed:1.2,rays:0,part:.7,drift:1,bursts:[[13.0,540,960],[17.0,540,750]]};
  if(t<3){cfg.grid=eOut(seg(t,0,.8))*.9;cfg.speed=lerp(3,1.4,seg(t,0,1.5))}
  else if(t<7){cfg.grid=.35*(1-seg(t,3,4))}
  else if(t<13){cfg.grid=0;cfg.part=.6}
  else if(t<17){cfg.rays=eOut(seg(t,13,13.6))*(1-seg(t,16.5,17))}
  else {cfg.rays=eOut(seg(t,17,17.6))*.8;cfg.rayY=750}
  drawBG(t,cfg);
  // glows
  const pul=.5+.5*Math.sin(t*4);
  glow('g1',300+Math.sin(t*.7)*120,600+Math.cos(t*.5)*160,.55,1+.1*Math.sin(t));
  glow('g2',800+Math.cos(t*.6)*120,1300+Math.sin(t*.8)*150,.5,1);
  let red=0; if(t>1.9&&t<3)red=.55*pul; if(t>=7&&t<8.5)red=.35+.25*pul; glow('g3',540,1150,red,1);

  // ---------- S1 (0-3)
  show($('s1'),t<3.2);
  if(t<3.2){
    const n=Math.round(438*eOut(seg(t,.05,1.15)));$('s1n').textContent=n;
    const pin=eBack(seg(t,0,.35)), out=eIO(seg(t,1.35,1.6));
    $('s1num').style.transform=`scale(${lerp(.4,1,pin)*(1+out*1.8)}) translateY(${Math.sin(t*40)*(1-seg(t,0,1.2))*4}px)`;
    $('s1num').style.opacity=cl(pin*3)*(1-out);$('s1num').style.filter=`blur(${out*30}px)`;
    $('s1kick').style.opacity=eOut(seg(t,.15,.5))*(1-out);$('s1kick').style.transform=`translateY(${(1-eOut(seg(t,.15,.5)))*-30}px)`;
    $('s1lab').style.opacity=eOut(seg(t,.55,.9))*(1-out);$('s1lab').style.transform=`translateY(${(1-eOut(seg(t,.55,.9)))*40}px)`;
    kin($('s1a'),'Ni una fecha',t,1.5,.45,.03,null,2.68);
    kin($('s1b'),'se te escapa.',t,1.95,.45,.03,'grad',2.68);
    const al=$('s1alert');const ap=seg(t,2.15,2.3);const gl=(Math.floor(t*30)%3===0)?.4:1;
    al.style.opacity=ap*gl*(1-seg(t,2.8,2.95));al.style.transform=`translateX(calc(-50% + ${(rnd(Math.floor(t*30))-.5)*14*ap}px)) scale(${lerp(1.3,1,eOut(ap))})`;
    if(t>1.35&&t<1.6)flash=Math.max(flash,(1-seg(t,1.4,1.6))*.6);
    // hook camera shake at start
    $('s1').style.transform=`scale(${1+(1-seg(t,0,.4))*.08})`;
  }

  // ---------- phone hero (3-7) + features (7-13) + push (16.3-17)
  const ph=$('ph');const A=$('phA'),B=$('phB');
  if(t>=2.85&&t<13.05){
    if(t<7){
      const p=eExpo(seg(t,2.85,3.9));
      phoneT(ph,{z:lerp(-2600,0,p),y:lerp(500,110,p),rx:lerp(40,6,p)+Math.sin(t*1.2)*1.5,ry:lerp(-35,-10,p)+Math.sin(t*.9)*4,rz:lerp(-12,0,p),s:.98,o:cl(p*4)});
      const sc=eIO(seg(t,3.9,6.8))*1460;scr(A,SHOT('home_dark_tall'),{ty:sc});scr(B,SHOT('home_dark'),{o:0});
      $('sheen').style.backgroundPosition=`${lerp(120,-60,seg(t,3.3,4.4))}% 0`;
      // exit to features: whip
      if(t>6.8){const q=eIO(seg(t,6.8,7.0));ph.style.transform+=` translateX(${q*-900}px)`;ph.style.filter=`blur(${q*20}px)`}
    } else {
      const k=Math.min(3,Math.floor((t-7)/1.5)),F=FEAT[k],lt=t-F.t0;
      const pin=eExpo(cl(lt/.35)), pout=eIO(seg(lt,1.32,1.5));
      const dir=k%2?1:-1;
      let o={x:(1-pin)*900*-dir+pout*900*dir,y:180,rx:6,ry:F.ry*(1-.3*seg(lt,0,1.5)),rz:dir*-2,s:lerp(1.08,.98,seg(lt,0,1.5)),b:(1-pin)*18+pout*18};
      phoneT(ph,o);
      $('sheen').style.backgroundPosition=`${lerp(120,-60,seg(lt,.1,.8))}% 0`;
      if(k===0){const z=eIO(seg(lt,.25,1.1));scr(A,SHOT(F.img),{s:lerp(1,1.55,z),ox:50,oy:24});scr(B,SHOT(F.img),{o:0});}
      else{const sw=seg(lt,.55,.7);scr(A,SHOT(F.img),{});scr(B,SHOT(F.img2),{o:sw, s:lerp(1.06,1,eOut(sw)),ox:50,oy:40});
        if(lt>.55&&lt<.75)flash=Math.max(flash,(1-seg(lt,.55,.75))*.25)}
    }
  } else if(t>=16.2&&t<17.05){
    // fly-through into center phone
    const p=eIO(seg(t,16.2,17.0));phoneT(ph,{z:lerp(-700,1900,p),y:lerp(150,0,p),s:1,o:1,ry:lerp(0,0,p)});scr(A,SHOT('home_dark'),{});scr(B,SHOT('home_dark'),{o:0});
    $('sheen').style.backgroundPosition=`${lerp(120,-60,p)}% 0`;
    flash=Math.max(flash,seg(t,16.75,17.0));
  } else phoneT(ph,{o:0});

  // S2 texts
  show($('s2'),t>=3&&t<7.1);
  if(t>=3&&t<7.1){
    const out=6.75;
    const tg=$('s2tag'),tp=eBack(seg(t,3.3,3.7));tg.style.opacity=cl(tp)*(1-seg(t,out,out+.2));tg.style.transform=`translateX(-50%) scale(${lerp(.5,1,tp)})`;
    kin($('s2a'),'Toda la unidad,',t,3.45,.45,.022,null,out);
    if(!$('s2b')){const d=document.createElement('div');d.className='t';d.id='s2b';d.style.cssText='top:310px;font-size:96px';$('s2').appendChild(d)}
    kin($('s2b'),'en tu bolsillo.',t,3.8,.45,.022,'grad',out);
    [['c1',4.6,-1],['c2',5.05,1],['c3',5.5,-1]].forEach(([id,t0,d])=>{const e=$(id),p=eBack(seg(t,t0,t0+.4)),q=eIO(seg(t,out,out+.2));
      e.style.opacity=cl(p*2)*(1-q);e.style.transform=`translate(${(1-p)*d*-200+q*d*-300}px,${Math.sin((t+t0)*2)*10}px) scale(${lerp(.6,1,p)})`});
  }
  // S3 texts
  show($('s3'),t>=7&&t<13.05);
