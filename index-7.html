<title>UP3 SGP PRO</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f1f5f9;--bg2:#fff;--bg3:#f8fafc;--bdr:#e2e8f0;--bdr2:#cbd5e1;
--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#eff6ff;
--indigo:#6366f1;--violet:#8b5cf6;
--green:#16a34a;--green-l:#f0fdf4;
--amber:#d97706;--amber-l:#fffbeb;
--red:#dc2626;--red-l:#fef2f2;
--orange:#ea580c;
--r:12px;--r2:8px;
--sh:0 1px 3px rgba(0,0,0,.06);--sh2:0 4px 12px rgba(0,0,0,.08);--sh3:0 20px 40px rgba(0,0,0,.15)
}
[data-theme=dark]{
--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bdr:#334155;--bdr2:#475569;
--tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;
--blue-l:rgba(37,99,235,.12);--green-l:rgba(22,163,74,.1);--amber-l:rgba(217,119,6,.1);--red-l:rgba(220,38,38,.1);
--sh:0 1px 3px rgba(0,0,0,.3);--sh2:0 4px 12px rgba(0,0,0,.3);--sh3:0 20px 40px rgba(0,0,0,.5)
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
#app{height:100%;display:flex;flex-direction:column}

.hdr{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%);position:relative;overflow:hidden;flex-shrink:0}
.hdr::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.hdr-in{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:relative;gap:8px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-ico{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px rgba(59,130,246,.4);flex-shrink:0}
.hdr h1{font-size:14px;font-weight:700;color:#fff}
.hdr p{font-size:10px;color:rgba(255,255,255,.5);margin-top:1px}
.hdr-act{display:flex;gap:6px;align-items:center}
.btn-h{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15);padding:5px 10px;border-radius:var(--r2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:4px}
.btn-h:hover{background:rgba(255,255,255,.2)}
.ss{background:linear-gradient(90deg,#1e40af,#4338ca,#7c3aed);padding:0 16px;display:flex;gap:0;overflow-x:auto;flex-shrink:0}
.ss::-webkit-scrollbar{display:none}
.sp{display:flex;align-items:center;gap:5px;padding:7px 14px;color:rgba(255,255,255,.8);font-size:10px;font-weight:500;border-right:1px solid rgba(255,255,255,.1);white-space:nowrap;flex-shrink:0;cursor:pointer;transition:.15s}
.sp:hover{background:rgba(255,255,255,.08)}
.sp b{color:#fff;font-size:13px;font-weight:800;margin-right:1px}

.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:64px}

/* Search */
.srch{position:sticky;top:0;z-index:10;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bdr)}
.srch-in{display:flex;gap:8px;align-items:center}
.srch input{flex:1;padding:10px 14px 10px 38px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:var(--r);color:var(--tx);font-size:14px;outline:none;font-family:inherit;transition:.15s}
.srch input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.srch .sico{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px}

/* Chips */
.chips{display:flex;gap:5px;overflow-x:auto;padding:6px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;background:var(--bg2);border:1.5px solid var(--bdr);border-radius:20px;font-size:11px;font-weight:600;color:var(--tx2);white-space:nowrap;cursor:pointer;transition:.15s;flex-shrink:0}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Cards */
.crd{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin:0 16px 8px;box-shadow:var(--sh);border-left:4px solid transparent;cursor:pointer;transition:transform .1s;position:relative}
.crd:active{transform:scale(.985)}
.crd.c-pen{border-left-color:var(--blue)}.crd.c-proc{border-left-color:var(--violet)}
.crd.c-urg{border-left-color:var(--red);background:var(--red-l)}
.crd.c-prx{border-left-color:var(--orange);background:var(--amber-l)}
.crd .nm{font-size:14px;font-weight:700;margin-bottom:2px}
.crd .inf{font-size:11px;color:var(--tx2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crd .meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.crd .rt{position:absolute;right:14px;top:14px}
.crd .arr{position:absolute;right:14px;bottom:14px;color:var(--tx3);font-size:14px}

/* Badges */
.bg-t{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:3px 8px;border-radius:12px;white-space:nowrap}
.bh{background:#fee2e2;color:#991b1b}.br{background:#dbeafe;color:#1e40af}
.bd{background:#dcfce7;color:#166534}.ba{background:#ffedd5;color:#9a3412}
.bl{background:#fef9c3;color:#854d0e}.bo{background:var(--bg3);color:var(--tx2)}
.bg-v{background:#fef3c7;color:#92400e}.bg-c{background:#dcfce7;color:#166534}
.bg-j{background:var(--bg3);color:var(--tx2);font-size:9px}
.bg-lib{background:#d1fae5;color:#065f46}

/* Alert cards */
.alrt{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin:0 16px 8px;box-shadow:var(--sh);border:1px solid var(--bdr)}
.alrt h3{font-size:12px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alrt .ai{padding:8px 0;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.alrt .ai:last-child{border-bottom:none}
.alrt .ai .nm{font-size:12px;font-weight:600}
.alrt .ai .dl{font-size:10px;color:var(--tx3)}

/* Metrics */
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 16px}
.mc{background:var(--bg2);border-radius:var(--r);padding:12px;box-shadow:var(--sh);border-top:3px solid transparent;text-align:center;cursor:pointer;transition:.15s}
.mc:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.mc.m-bl{border-top-color:#3b82f6}.mc.m-vi{border-top-color:#8b5cf6}
.mc.m-gn{border-top-color:#16a34a}.mc.m-am{border-top-color:#d97706}
.mc.m-rd{border-top-color:#dc2626}.mc.m-in{border-top-color:#6366f1}
.mc .mv{font-size:24px;font-weight:800;line-height:1}.mc .mk{font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* Charts */
.cht{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin:0 16px 8px;box-shadow:var(--sh)}
.cht h4{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.cht h4::before{content:'';width:3px;height:10px;border-radius:2px;background:var(--blue)}
.brow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.brow .bl2{width:110px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;font-size:10px;font-weight:500}
.brow .bbg{flex:1;background:var(--bg);border-radius:3px;height:12px;overflow:hidden}
.brow .bfl{height:100%;border-radius:3px;transition:.4s}
.brow .bnum{width:24px;text-align:right;color:var(--tx);font-weight:700;flex-shrink:0;font-size:10px}
.chts-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:8px}
@media(max-width:600px){.chts-g{grid-template-columns:1fr}}

.cnt-bar{font-size:11px;color:var(--tx3);padding:4px 16px;display:flex;justify-content:space-between;align-items:center}
.cnt-bar a{color:var(--blue);cursor:pointer;font-weight:600}

/* Bottom Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bdr);display:flex;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;padding:6px 0 4px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.ni .nio{font-size:18px;display:block;line-height:1}
.ni .nil{font-size:8px;color:var(--tx3);margin-top:2px;font-weight:600}
.ni.on .nio,.ni.on .nil{color:var(--blue)}
.ni .bdg{position:absolute;top:1px;right:calc(50% - 16px);background:var(--red);color:#fff;font-size:7px;font-weight:700;padding:1px 4px;border-radius:8px;min-width:12px}

/* Modal/Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);padding:16px}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:sUp .25s ease-out}
@keyframes sUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet .handle{width:36px;height:4px;background:var(--bdr2);border-radius:4px;margin:0 auto 14px}
.sheet h2{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sheet .dr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.sheet .dk{color:var(--tx2);font-size:10px;font-weight:600;min-width:100px}
.sheet .dv{font-weight:600;text-align:right;max-width:55%}

/* Ficha modal - NEW */
.ficha{background:var(--bg2);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh3);animation:fIn .2s ease-out;border:1px solid var(--bdr)}
@keyframes fIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ficha-top{padding:20px 20px 0;position:relative}
.ficha-top .close-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--bg);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--tx2);transition:.15s}
.ficha-top .close-x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.ficha-header{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.ficha-av{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.ficha-av.fp2{background:linear-gradient(135deg,#1e40af,#3b82f6)}
.ficha-av.fr2{background:linear-gradient(135deg,#7c3aed,#a855f7)}
.ficha-name{font-size:18px;font-weight:800;line-height:1.2}
.ficha-badges{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.ficha-status{margin:0 20px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.ficha-status.fs-ok{background:var(--green-l);color:#166534;border:1px solid rgba(22,163,74,.2)}
.ficha-status.fs-urg{background:var(--red-l);color:#991b1b;border:1px solid rgba(220,38,38,.2)}
.ficha-status.fs-prx{background:var(--amber-l);color:#92400e;border:1px solid rgba(217,119,6,.2)}
.ficha-body{padding:12px 20px}
.ficha-section{margin-bottom:14px}
.ficha-section h4{font-size:9px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--bdr)}
.ficha-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
.ficha-row .fk{color:var(--tx2);font-weight:500}
.ficha-row .fv{font-weight:700;text-align:right;max-width:55%}
.ficha-actions{padding:10px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ficha-actions .btn{font-size:12px;padding:10px}

/* Form */
.fg{margin-bottom:10px}
.fg label{display:block;font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--bdr);border-radius:var(--r2);color:var(--tx);font-size:13px;outline:none;font-family:inherit;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.fg textarea{resize:vertical;min-height:50px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Buttons */
.btn{padding:10px 18px;border:none;border-radius:var(--r2);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;width:100%}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,var(--blue),var(--indigo));color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.bg2{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff}
.brd{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff}
.bgh{background:var(--bg);color:var(--tx);border:1.5px solid var(--bdr)}
.bel{background:linear-gradient(135deg,#ea580c,#dc2626);color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.3)}
.btn-s{padding:6px 12px;font-size:11px;width:auto}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}

/* History card */
.hc{background:var(--bg2);border-radius:var(--r);padding:12px 16px;margin:0 16px 6px;box-shadow:var(--sh);border-left:4px solid var(--green)}
.hc .nm{font-size:13px;font-weight:700}
.hc .inf{font-size:10px;color:var(--tx2);margin-top:2px}
.hc .flib{font-size:11px;color:var(--green);font-weight:700;margin-top:4px}

/* Toast */
.toast{position:fixed;top:16px;left:16px;right:16px;padding:12px 16px;border-radius:var(--r);font-size:12px;font-weight:600;z-index:200;text-align:center;animation:tIn .3s;box-shadow:var(--sh2)}
.toast.ok{background:#dcfce7;color:#166534;border:1px solid #86efac}
.toast.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
@keyframes tIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.footer{text-align:center;padding:8px 16px;font-size:9px;color:var(--tx3)}

@media(min-width:768px){
 .main{padding-bottom:70px}
 .crd,.alrt,.cht,.hc{max-width:720px;margin-left:auto;margin-right:auto}
 .mets,.chts-g,.cnt-bar,.chips{max-width:720px;margin-left:auto;margin-right:auto}
 .sheet{max-width:520px;border-radius:16px;margin-bottom:20px}
 .ov{align-items:center}
 .bnav{max-width:520px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}
 .mets{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:380px){
 .mets{grid-template-columns:repeat(2,1fr)}
 .hdr h1{font-size:12px}
}

</style>
</head>

var td=new Date(),tds=td.toLocaleDateString('es-AR');

function togDark(){dark=!dark;localStorage.setItem('up3_dark',dark?'1':'0');document.documentElement.setAttribute('data-theme',dark?'dark':'');ren()}

function pdt(ds){if(!ds||ds==='-'||ds==='PERPETUA')return null;var p=ds.split('/');if(p.length!==3)return null;var d=new Date(p[2],p[1]-1,p[0]);return isNaN(d)?null:d}
function dd(ds){var d=pdt(ds);return d?Math.ceil((d-td)/864e5):null}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'):''}
function cat(d){d=(d||'').toUpperCase();if(d.includes('HOMICID'))return'bh';if(d.includes('ROBO')||d.includes('HURTO'))return'br';if(d.includes('ESTUP')||d.includes('NARC')||d.includes('23.737')||d.includes('23737')||d.includes('10,566')||d.includes('COMERC'))return'bd';if(d.includes('ABUSO')||d.includes('SEXUAL'))return'ba';if(d.includes('LESION'))return'bl';return'bo'}
function catL(d){d=(d||'').toUpperCase();if(d.includes('HOMICID'))return'Homicidio';if(d.includes('ROBO'))return'Robo';if(d.includes('HURTO'))return'Hurto';if(d.includes('ESTUP')||d.includes('NARC')||d.includes('23.737')||d.includes('COMERC'))return'Drogas';if(d.includes('ABUSO')||d.includes('SEXUAL'))return'Sexual';if(d.includes('LESION'))return'Lesiones';return'Otro'}
function topN(arr,n){var m={};arr.forEach(function(v){if(v)m[v]=(m[v]||0)+1});return Object.entries(m).sort(function(a,b){return b[1]-a[1]}).slice(0,n||8)}
function bbar(data,color){var mx=Math.max.apply(null,data.map(function(d){return d[1]}));if(!mx)mx=1;return data.map(function(d){var pct=Math.round(d[1]/mx*100);return'<div class="brow"><div class="bl2" title="'+esc(d[0])+'">'+esc(d[0].length>16?d[0].slice(0,16)+'…':d[0])+'</div><div class="bbg"><div class="bfl" style="width:'+pct+'%;background:'+color+'"></div></div><div class="bnum">'+d[1]+'</div></div>'}).join('')}

function renList(){
  var el=document.getElementById('lst');if(!el){ren();return}
  var tp=S.v==='pen'?'P':S.v==='proc'?'R':'A';
  var items=tp==='P'?P.map(function(r){return{t:'P',r:r}}):tp==='R'?R.map(function(r){return{t:'R',r:r}}):all();

}

function toast(m,t){S.toast=m;S.tc=t||'ok';ren();setTimeout(function(){S.toast='';ren()},2500)}
function all(){return P.map(function(r){return{t:'P',r:r}}).concat(R.map(function(r){return{t:'R',r:r}}))}

function srch(items){
  var d=items;
  if(S.q){var qq=S.q.toUpperCase();d=d.filter(function(x){var r=x.r;return((r[1]||'')+' '+(r[2]||'')+' '+(r[3]||'')+' '+(r[5]||'')+' '+(r[4]||'')).toUpperCase().indexOf(qq)>=0})}
  if(S.fj)d=d.filter(function(x){return x.r[4]===S.fj});
  d.sort(function(a,b){return(a.r[1]||'').localeCompare(b.r[1]||'','es')});
  return d;
}

function pDays(x){return x.t==='P'?dd(x.r[8]):dd(x.r[7])}

function pCls(x){var d=pDays(x);if(d!==null&&d<=0)return'c-urg';if(d!==null&&d<=90)return'c-prx';return x.t==='P'?'c-pen':'c-proc'}
function pSta(x){var d=pDays(x);if(d===null)return'';if(d<=0)return'<span class="bg-t bg-c">CUMPLIDO</span>';if(d<=30)return'<span class="bg-t bg-v">'+d+'d</span>';if(d<=90)return'<span class="bg-t bg-v" style="opacity:.7">'+d+'d</span>';if(d<=180)return'<span class="bg-t bg-v" style="opacity:.5">'+Math.ceil(d/30)+'m</span>';return''}
